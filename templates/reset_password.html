{% extends "layout.html" %}
{% block content %}
    <div class="content-section py-3 px-4 mb-4">
        <h2 class="mb-4">Reset Password</h2>
        <p class="text-body-secondary mb-4">Enter your new password below.</p>
        <form id="resetPasswordForm">
            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password"
                       class="form-control"
                       id="newPassword"
                       name="new_password"
                       required
                       minlength="8"
                       autofocus>
                <div class="form-text">Password must be at least 8 characters.</div>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <input type="password"
                       class="form-control"
                       id="confirmPassword"
                       name="confirm_password"
                       required
                       minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" id="rpSubmitBtn">Reset Password</button>
        </form>
        <p class="mt-3">
            Remember your password? <a href="{{ url_for('login_page') }}">Login here</a>
        </p>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">
  import { getErrorMessage, showModal } from '/static/js/utils.js';

  const resetPasswordForm = document.getElementById('resetPasswordForm');
  const submitBtn = document.getElementById('rpSubmitBtn');

  // Read the token from the URL query string
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  if (!token) {
    document.getElementById('errorMessage').textContent =
      'Invalid or missing reset token. Please request a new password reset link.';
    showModal('errorModal');
    resetPasswordForm.querySelector('button[type="submit"]').disabled = true;
  }

  resetPasswordForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
      document.getElementById('errorMessage').textContent = 'Passwords do not match.';
      showModal('errorModal');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Resetting...';

    try {
      const response = await fetch('/api/users/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: newPassword }),
      });

      if (response.ok) {
        document.getElementById('successMessage').textContent =
          'Password reset successful! You can now log in with your new password.';
        showModal('successModal');
        resetPasswordForm.reset();
        // Redirect to login after a short delay
        setTimeout(() => { window.location.href = '/login'; }, 2500);
      } else {
        const error = await response.json();
        document.getElementById('errorMessage').textContent = getErrorMessage(error);
        showModal('errorModal');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    } catch (error) {
      document.getElementById('errorMessage').textContent =
        'Network error. Please check your connection and try again.';
      showModal('errorModal');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset Password';
    }
  });
    </script>
{% endblock scripts %}
