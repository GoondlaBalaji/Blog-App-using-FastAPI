{% extends "layout.html" %}
{% block content %}
    <div class="content-section py-3 px-4 mb-4">
        <h2 class="mb-4">Forgot Password</h2>
        <p class="text-body-secondary mb-4">Enter your email address and we'll send you a link to reset your password.</p>
        <form id="forgotPasswordForm">
            <div class="mb-3">
                <label for="fpEmail" class="form-label">Email</label>
                <input type="email"
                       class="form-control"
                       id="fpEmail"
                       name="email"
                       required
                       autofocus>
            </div>
            <button type="submit" class="btn btn-primary" id="fpSubmitBtn">Send Reset Link</button>
        </form>
        <p class="mt-3">
            Remember your password? <a href="{{ url_for('login_page') }}">Login here</a>
        </p>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">
  import { getErrorMessage, showModal } from '/static/js/utils.js';

  const forgotPasswordForm = document.getElementById('forgotPasswordForm');
  const submitBtn = document.getElementById('fpSubmitBtn');

  forgotPasswordForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    const email = document.getElementById('fpEmail').value;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    try {
      const response = await fetch('/api/users/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });

      // Always show a success message regardless of whether the email exists
      // (prevents user enumeration)
      document.getElementById('successMessage').textContent =
        'If an account with that email exists, a reset link has been sent. Please check your inbox.';
      showModal('successModal');
      forgotPasswordForm.reset();
    } catch (error) {
      document.getElementById('errorMessage').textContent =
        'Network error. Please check your connection and try again.';
      showModal('errorModal');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Reset Link';
    }
  });
    </script>
{% endblock scripts %}
